# A release published on GitHub gets its downloads here: they are built from the source of its tag and attached to it.
# Run by hand (Actions → Release → Run workflow) it only builds them, as an artifact to try out.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# nothing by default; the job that attaches the downloads gets write access to the releases only
permissions: {}

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Rust
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer and the portable exe files
        shell: pwsh
        run: ./release.ps1


      - name: Checksums
        shell: pwsh
        run: Get-ChildItem build/dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content build/dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HeMiPad
          path: build/dist/*

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:TAG" build/dist/HeMiPad-Setup.exe build/dist/HeMiPad-Portable.exe build/dist/HeMiPad-Portable-arm64.exe build/dist/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
