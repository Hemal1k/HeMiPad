# A release published on GitHub gets its downloads here: they are built from the source of its tag and attached to it.
# Run by hand (Actions → Release → Run workflow) it only builds them, as an artifact to try out.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# nothing by default; the job that attaches the downloads gets write access to the releases only
permissions: {}

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.ref }}

      # the tag of the release must be the version in Cargo.toml (v1.3.0 = 1.3.0): else the downloads would carry another
      # version than the release they are attached to
      - name: Tag = version
        if: github.event_name == 'release'
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:TAG.TrimStart('v') -ne $version) { throw "The tag $env:TAG is not the version $version of Cargo.toml." }

      # fixed versions: the same compiler and installer builder for every release (the ones release.ps1 is tried with)
      - name: Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
          rustup default 1.99.1

      - name: Inno Setup
        run: choco install innosetup --version=6.7.3 --no-progress -y

      - name: Build the installer and the portable exe files
        shell: pwsh
        run: ./release.ps1


      - name: Checksums
        shell: pwsh
        run: Get-ChildItem build/dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content build/dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HeMiPad
          path: build/dist/*

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:TAG" build/dist/HeMiPad-Setup.exe build/dist/HeMiPad-Portable.exe build/dist/HeMiPad-Portable-arm64.exe build/dist/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
